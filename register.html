<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Moldex Realty</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="description" content="Create a customer account for the Moldex Realty facility reservation system.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Inner pages stylesheet (standalone: style.css is not used on this page) -->
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="nav-account.css">
    <link rel="stylesheet" href="hero-bg.css">
</head>

<body id="registerPage">

<main>

    <section class="auth-page register-page">
        <div class="container">
            <div class="auth-layout">

                <!-- RIGHT — FORM -->
                <div class="auth-card register-card">
                    <a href="/" class="auth-logo" aria-label="Moldex Realty home">
                        <img src="img/logo-moldex-realty.png" alt="Moldex Realty">
                    </a>
                    <div class="auth-card-header">
                        <h2>Create your account</h2>
                    </div>

                    <form class="auth-form" id="registerForm">
                        <div class="form-two-column">
                            <div class="form-group">
                                <label for="firstName">First name</label>
                                <input type="text" id="firstName" name="first_name" autocomplete="off" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last name</label>
                                <input type="text" id="lastName" name="last_name" autocomplete="off" required>
                            </div>
                        </div>

                        <div class="form-two-column">
                            <div class="form-group">
                            <label for="registerEmail">Email address</label>
                            <input type="email" id="registerEmail" name="email" autocomplete="off" required>
                        </div>
                            <div class="form-group">
                            <label for="phoneNumber">Contact number</label>
                            <input type="tel" id="phoneNumber" name="phone" autocomplete="off" required>
                        </div>
                        </div>

                        <div class="form-group">
                            <label for="registerAddress">Address</label>
                            <input type="text" id="registerAddress" name="address" autocomplete="off" required>
                        </div>

                        <div class="form-two-column">
                            <div class="form-group">
                                <label for="registerPassword">Password</label>
                                <input type="password" id="registerPassword" name="password" autocomplete="new-password" required>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm password</label>
                                <input type="password" id="confirmPassword" name="confirm_password" autocomplete="new-password" required>
                            </div>
                        </div>

                        <div class="form-checkbox">
                            <label>
                                <input type="checkbox" id="registerTerms" name="terms" required>
                                <span>I confirm that the information I provided is accurate and I agree to the system's booking guidelines.</span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-dark btn-large auth-submit" id="submitRegisterBtn">Create account</button>
                    </form>

                    <div class="auth-register">
                        <span>Already registered?</span>
                        <a href="login.html">Log in</a>
                    </div>

                    <div class="auth-guest"><a href="booking.html" class="text-link">Book as guest</a></div>
                    </div>

            </div>
        </div>
        <p class="auth-foot"><span>&copy; 2026 Moldex Realty</span></p>
    </section>


</main>


<script src="script.js"></script>
<script src="nav.js"></script>
<script src="hero-lines.js"></script>
<script src="hero-ball3d.js"></script>
<script src="legal.js"></script>
<script src="smooth.js"></script>
</body>
</html>
